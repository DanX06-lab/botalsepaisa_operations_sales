services:
  # Backend API Server
  - type: web
    name: botalsepaisa-api
    runtime: node
    plan: free
    buildCommand: cd artifacts/api-server && npm install && npm run build
    startCommand: cd artifacts/api-server && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_NAME
        value: botalsepaisa
      - key: SESSION_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://botalsepaisa-frontend.onrender.com

  # Frontend Operations Portal
  - type: web
    name: botalsepaisa-frontend
    runtime: static
    plan: free
    buildCommand: cd artifacts/operations-portal && npm install && npm run build
    publishDir: artifacts/operations-portal/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://botalsepaisa-api.onrender.com
