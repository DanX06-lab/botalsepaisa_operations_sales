openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: BotalSePaisa Operations Portal API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: shops
    description: Shop management
  - name: collections
    description: Collection entries
  - name: reports
    description: Reports
  - name: settings
    description: Application settings
  - name: dashboard
    description: Dashboard summary
  - name: routes
    description: Route planning

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginCredentials"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToken"
        "401":
          description: Invalid credentials

  /shops:
    get:
      operationId: listShops
      tags: [shops]
      summary: List all shops
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search by shop name, owner name, or mobile
        - name: page
          in: query
          schema:
            type: number
          description: Page number
        - name: limit
          in: query
          schema:
            type: number
          description: Items per page
      responses:
        "200":
          description: List of shops
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopList"
    post:
      operationId: createShop
      tags: [shops]
      summary: Create a new shop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopInput"
      responses:
        "201":
          description: Shop created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shop"

  /shops/{id}:
    get:
      operationId: getShop
      tags: [shops]
      summary: Get shop by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Shop found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shop"
        "404":
          description: Shop not found
    put:
      operationId: updateShop
      tags: [shops]
      summary: Update a shop
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopUpdate"
      responses:
        "200":
          description: Shop updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shop"
        "404":
          description: Shop not found
    delete:
      operationId: deleteShop
      tags: [shops]
      summary: Delete a shop
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Shop deleted
        "404":
          description: Shop not found

  /collections:
    get:
      operationId: listCollections
      tags: [collections]
      summary: List collection entries
      parameters:
        - name: shopId
          in: query
          schema:
            type: number
        - name: startDate
          in: query
          schema:
            type: string
        - name: endDate
          in: query
          schema:
            type: string
        - name: paymentStatus
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: number
        - name: limit
          in: query
          schema:
            type: number
      responses:
        "200":
          description: List of collections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionList"
    post:
      operationId: createCollection
      tags: [collections]
      summary: Create a collection entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionInput"
      responses:
        "201":
          description: Collection created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"

  /collections/{id}:
    get:
      operationId: getCollection
      tags: [collections]
      summary: Get a single collection entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Collection found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "404":
          description: Not found

  /collections/{id}/payment:
    patch:
      operationId: updatePaymentStatus
      tags: [collections]
      summary: Mark a collection as paid or pending
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentUpdate"
      responses:
        "200":
          description: Payment status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "404":
          description: Not found

  /reports:
    get:
      operationId: getReports
      tags: [reports]
      summary: Get report data with filters
      parameters:
        - name: shopId
          in: query
          schema:
            type: number
        - name: week
          in: query
          schema:
            type: string
          description: ISO week string e.g. 2024-W01
        - name: month
          in: query
          schema:
            type: string
          description: Month string e.g. 2024-01
        - name: startDate
          in: query
          schema:
            type: string
        - name: endDate
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Report data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResult"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get current settings
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /routes/today:
    get:
      operationId: getTodayRoute
      tags: [routes]
      summary: Get today's route
      responses:
        "200":
          description: Today's route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        "404":
          description: No route found for today

  /routes:
    get:
      operationId: listRoutes
      tags: [routes]
      summary: List all routes
      responses:
        "200":
          description: List of routes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Route"

  /routes/eligible-shops:
    get:
      operationId: getEligibleShops
      tags: [routes]
      summary: Get shops with valid GPS for route planning
      responses:
        "200":
          description: List of eligible shops
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Shop"

  /routes/generate:
    post:
      operationId: generateRoute
      tags: [routes]
      summary: Generate a new route
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteGenerateRequest"
      responses:
        "201":
          description: Route created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        "400":
          description: Invalid request
        "409":
          description: Route already exists for this date

  /routes/{id}:
    get:
      operationId: getRoute
      tags: [routes]
      summary: Get a specific route
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Route found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        "404":
          description: Route not found

  /routes/{id}/start:
    post:
      operationId: startRoute
      tags: [routes]
      summary: Start a route
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Route started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        "400":
          description: Invalid status
        "404":
          description: Route not found

  /routes/{id}/complete:
    post:
      operationId: completeRoute
      tags: [routes]
      summary: Complete a route
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Route completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        "400":
          description: Invalid status or pending stops
        "404":
          description: Route not found

  /routes/{id}/cancel:
    post:
      operationId: cancelRoute
      tags: [routes]
      summary: Cancel a route
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Route cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        "400":
          description: Cannot cancel completed route
        "404":
          description: Route not found

  /routes/{id}/regenerate:
    post:
      operationId: regenerateRoute
      tags: [routes]
      summary: Regenerate a route
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteGenerateRequest"
      responses:
        "201":
          description: New route created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        "400":
          description: Invalid request
        "404":
          description: Route not found

  /routes/{id}/stops/{stopId}/visit:
    post:
      operationId: visitStop
      tags: [routes]
      summary: Mark a stop as visited
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
        - name: stopId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                collectionId:
                  type: number
      responses:
        "200":
          description: Stop marked as visited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        "400":
          description: Invalid status
        "404":
          description: Route or stop not found

  /routes/{id}/stops/{stopId}/skip:
    post:
      operationId: skipStop
      tags: [routes]
      summary: Skip a stop
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
        - name: stopId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skipReason]
              properties:
                skipReason:
                  type: string
      responses:
        "200":
          description: Stop skipped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        "400":
          description: Invalid status or missing reason
        "404":
          description: Route or stop not found

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    LoginCredentials:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthToken:
      type: object
      required: [token, username, role]
      properties:
        token:
          type: string
        username:
          type: string
        role:
          type: string

    Shop:
      type: object
      required: [id, shopId, shopName, ownerName, mobile, createdAt]
      properties:
        id:
          type: number
        shopId:
          type: string
        shopName:
          type: string
        ownerName:
          type: string
        mobile:
          type: string
        latitude:
          type: ["number", "null"]
        longitude:
          type: ["number", "null"]
        accuracy:
          type: ["number", "null"]
        locationCapturedAt:
          type: ["string", "null"]
        photoUrl:
          type: ["string", "null"]
        createdAt:
          type: string

    ShopInput:
      type: object
      required: [shopName, ownerName, mobile, photoBase64]
      properties:
        shopName:
          type: string
          minLength: 1
        ownerName:
          type: string
          minLength: 1
        mobile:
          type: string
          minLength: 1
        latitude:
          type: number
        longitude:
          type: number
        accuracy:
          type: number
        photoBase64:
          type: string

    ShopUpdate:
      type: object
      properties:
        shopName:
          type: string
          minLength: 1
        ownerName:
          type: string
          minLength: 1
        mobile:
          type: string
          minLength: 1
        latitude:
          type: number
        longitude:
          type: number
        accuracy:
          type: number
        photoBase64:
          type: string

    ShopList:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Shop"
        total:
          type: number
        page:
          type: number
        limit:
          type: number

    Collection:
      type: object
      required: [id, shopId, collectionDate, weightKg, ratePerKg, totalAmount, paymentStatus, createdAt]
      properties:
        id:
          type: number
        shopId:
          type: number
        shop:
          $ref: "#/components/schemas/Shop"
        collectionDate:
          type: string
        weightKg:
          type: number
        ratePerKg:
          type: number
        totalAmount:
          type: number
        paymentStatus:
          type: string
        paymentDate:
          type: ["string", "null"]
        paidBy:
          type: ["string", "null"]
        routeId:
          type: ["number", "null"]
        routeStopSequence:
          type: ["number", "null"]
        createdAt:
          type: string

    CollectionInput:
      type: object
      required: [shopId, collectionDate, weightKg]
      properties:
        shopId:
          type: number
        collectionDate:
          type: string
        weightKg:
          type: number
        routeId:
          type: ["number", "null"]
        routeStopSequence:
          type: ["number", "null"]

    CollectionList:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Collection"
        total:
          type: number
        page:
          type: number
        limit:
          type: number

    PaymentUpdate:
      type: object
      required: [paymentStatus]
      properties:
        paymentStatus:
          type: string
        paymentDate:
          type: ["string", "null"]
        paidBy:
          type: ["string", "null"]

    ReportEntry:
      type: object
      required: [id, shopId, shop, collectionDate, weightKg, ratePerKg, totalAmount, paymentStatus, createdAt]
      properties:
        id:
          type: number
        shopId:
          type: number
        shop:
          $ref: "#/components/schemas/Shop"
        collectionDate:
          type: string
        weightKg:
          type: number
        ratePerKg:
          type: number
        totalAmount:
          type: number
        paymentStatus:
          type: string
        paymentDate:
          type: ["string", "null"]
        paidBy:
          type: ["string", "null"]
        createdAt:
          type: string

    ReportResult:
      type: object
      required: [data, totalKg, totalAmount]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ReportEntry"
        totalKg:
          type: number
        totalAmount:
          type: number

    Settings:
      type: object
      required: [id, pricePerKg]
      properties:
        id:
          type: number
        pricePerKg:
          type: number
        homeLatitude:
          type: ["number", "null"]
        homeLongitude:
          type: ["number", "null"]

    SettingsUpdate:
      type: object
      required: [pricePerKg]
      properties:
        pricePerKg:
          type: number
        homeLatitude:
          type: ["number", "null"]
        homeLongitude:
          type: ["number", "null"]

    DashboardSummary:
      type: object
      required: [totalShops, totalKgCollected, totalAmountPayable, pendingPayments, recentCollections]
      properties:
        totalShops:
          type: number
        totalKgCollected:
          type: number
        totalAmountPayable:
          type: number
        pendingPayments:
          type: number
        recentCollections:
          type: array
          items:
            $ref: "#/components/schemas/Collection"

    RouteStop:
      type: object
      required: [sequence, shopId, shopName, latitude, longitude, distanceFromPreviousKm, estimatedArrivalMinutes, status]
      properties:
        sequence:
          type: number
        shopId:
          type: number
        shopName:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        distanceFromPreviousKm:
          type: number
        estimatedArrivalMinutes:
          type: number
        status:
          type: string
          enum: ["PENDING", "VISITED", "SKIPPED"]
        visitedAt:
          type: ["string", "null"]
        collectionId:
          type: ["number", "null"]
        skipReason:
          type: ["string", "null"]

    Route:
      type: object
      required: [id, routeDate, createdBy, homeLocation, stops, totalShops, totalDistanceKm, estimatedDurationMinutes, status, createdAt]
      properties:
        id:
          type: number
        routeDate:
          type: string
        createdBy:
          type: number
        homeLocation:
          type: object
          required: [latitude, longitude]
          properties:
            latitude:
              type: number
            longitude:
              type: number
        stops:
          type: array
          items:
            $ref: "#/components/schemas/RouteStop"
        totalShops:
          type: number
        totalDistanceKm:
          type: number
        estimatedDurationMinutes:
          type: number
        status:
          type: string
          enum: ["PLANNED", "IN_PROGRESS", "COMPLETED", "CANCELLED"]
        createdAt:
          type: string
        startedAt:
          type: ["string", "null"]
        completedAt:
          type: ["string", "null"]

    RouteGenerateRequest:
      type: object
      required: [routeDate, shopIds]
      properties:
        routeDate:
          type: string
        shopIds:
          type: array
          items:
            type: number
