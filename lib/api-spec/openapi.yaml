openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: BotalSePaisa Operations Portal API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: shops
    description: Shop management
  - name: collections
    description: Collection entries
  - name: reports
    description: Reports
  - name: settings
    description: Application settings
  - name: dashboard
    description: Dashboard summary
  - name: routes
    description: Route planning
  - name: prospects
    description: Prospect management
  - name: intelligence
    description: Intelligence module


paths:
  /intelligence/businesses:
    get:
      operationId: listIntelligenceBusinesses
      tags: [intelligence]
      summary: List all intelligence businesses
      responses:
        "200":
          description: List of intelligence businesses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IntelligenceBusiness"
    post:
      operationId: createIntelligenceBusiness
      tags: [intelligence]
      summary: Create a new intelligence business
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntelligenceBusinessInput"
      responses:
        "201":
          description: Intelligence Business created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelligenceBusiness"

  /intelligence/businesses/{id}:
    put:
      operationId: updateIntelligenceBusiness
      tags: [intelligence]
      summary: Update intelligence business
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntelligenceBusinessInput"
      responses:
        "200":
          description: Updated business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelligenceBusiness"

  /intelligence/verification/queue:
    get:
      operationId: getVerificationQueue
      tags: [intelligence]
      summary: Get verification queue
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema: { type: string }
        - name: zone_id
          in: query
          schema: { type: string }
        - name: area_id
          in: query
          schema: { type: string }
        - name: ward_id
          in: query
          schema: { type: string }
        - name: borough_id
          in: query
          schema: { type: string }
        - name: source
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: number }
        - name: limit
          in: query
          schema: { type: number }
      responses:
        "200":
          description: Verification queue
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/IntelligenceBusiness"
                  total:
                    type: number
                  page:
                    type: number
                  limit:
                    type: number

  /intelligence/verification/{id}/history:
    get:
      operationId: getVerificationHistory
      tags: [intelligence]
      summary: Get verification history
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Verification history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VerificationHistory"

  /intelligence/verification/{id}/status:
    post:
      operationId: updateVerificationStatus
      tags: [intelligence]
      summary: Update verification status
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationStatusRequest"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelligenceBusiness"

  /intelligence/verification/bulk-status:
    post:
      operationId: bulkUpdateVerificationStatus
      tags: [intelligence]
      summary: Bulk update verification status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkVerificationRequest"
      responses:
        "200":
          description: Statuses updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: number

  /intelligence/verification/{id}/duplicate:
    post:
      operationId: markAsDuplicate
      tags: [intelligence]
      summary: Mark business as duplicate
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DuplicateReviewRequest"
      responses:
        "200":
          description: Duplicate marked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelligenceBusiness"

  /intelligence/businesses/map:
    get:
      operationId: listIntelligenceMap
      tags: [intelligence]
      summary: List intelligence businesses for a map view
      parameters:
        - name: min_lng
          in: query
          schema:
            type: number
        - name: min_lat
          in: query
          schema:
            type: number
        - name: max_lng
          in: query
          schema:
            type: number
        - name: max_lat
          in: query
          schema:
            type: number
        - name: business_type
          in: query
          schema:
            type: string
        - name: zone_id
          in: query
          schema:
            type: string
        - name: area_id
          in: query
          schema:
            type: string
        - name: rating_min
          in: query
          schema:
            type: number
        - name: cuisine
          in: query
          schema:
            type: string
        - name: verification_status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Intelligence Map Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelligenceMapResponse"

  /intelligence/businesses/nearby:
    get:
      operationId: getIntelligenceNearby
      tags: [intelligence]
      summary: Get nearby intelligence businesses
      parameters:
        - name: lng
          in: query
          schema:
            type: number
        - name: lat
          in: query
          schema:
            type: number
        - name: radius_km
          in: query
          schema:
            type: number
      responses:
        "200":
          description: Intelligence Map Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelligenceMapResponse"

  /intelligence/import/preview:
    post:
      operationId: previewIntelligenceImport
      tags: [intelligence]
      summary: Preview CSV data import
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportPreviewRequest"
      responses:
        "200":
          description: Import preview stats and annotated rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreviewResponse"

  /intelligence/import/confirm:
    post:
      operationId: confirmIntelligenceImport
      tags: [intelligence]
      summary: Confirm and execute CSV data import
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportPreviewRequest"
      responses:
        "200":
          description: Import confirmed and executed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportHistory"

  /intelligence/import/history:
    get:
      operationId: getIntelligenceImportHistory
      tags: [intelligence]
      summary: Get import history logs
      responses:
        "200":
          description: List of import history logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ImportHistory"

  /intelligence/discovery/sync:
    post:
      operationId: syncDiscovery
      tags: [intelligence]
      summary: Trigger an automatic discovery sync with OSM Overpass API
      responses:
        "200":
          description: Discovery sync completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResponse"

  /intelligence/discovery/history:
    get:
      operationId: getDiscoveryHistory
      tags: [intelligence]
      summary: Get discovery sync history logs
      responses:
        "200":
          description: List of discovery sync history logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyncHistory"

  /intelligence/coverage/overview:
    get:
      operationId: getCoverageOverview
      tags: [intelligence]
      summary: Get coverage overview
      parameters:
        - name: zone_id
          in: query
          schema: { type: string }
        - name: area_id
          in: query
          schema: { type: string }
        - name: ward_id
          in: query
          schema: { type: string }
        - name: borough_id
          in: query
          schema: { type: string }
        - name: business_type
          in: query
          schema: { type: string }
        - name: verification_status
          in: query
          schema: { type: string }
        - name: source
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Coverage overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoverageOverview"

  /intelligence/coverage/zones:
    get:
      operationId: getZoneCoverage
      tags: [intelligence]
      summary: Get coverage by zones
      parameters:
        - name: zone_id
          in: query
          schema: { type: string }
        - name: area_id
          in: query
          schema: { type: string }
        - name: ward_id
          in: query
          schema: { type: string }
        - name: borough_id
          in: query
          schema: { type: string }
        - name: business_type
          in: query
          schema: { type: string }
        - name: verification_status
          in: query
          schema: { type: string }
        - name: source
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Zone coverage
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ZoneCoverage"

  /intelligence/coverage/areas:
    get:
      operationId: getAreaCoverage
      tags: [intelligence]
      summary: Get coverage by areas
      parameters:
        - name: zone_id
          in: query
          schema: { type: string }
        - name: area_id
          in: query
          schema: { type: string }
        - name: ward_id
          in: query
          schema: { type: string }
        - name: borough_id
          in: query
          schema: { type: string }
        - name: business_type
          in: query
          schema: { type: string }
        - name: verification_status
          in: query
          schema: { type: string }
        - name: source
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Area coverage
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AreaCoverage"

  /intelligence/coverage/wards:
    get:
      operationId: getWardCoverage
      tags: [intelligence]
      summary: Get coverage by wards
      parameters:
        - name: zone_id
          in: query
          schema: { type: string }
        - name: area_id
          in: query
          schema: { type: string }
        - name: ward_id
          in: query
          schema: { type: string }
        - name: borough_id
          in: query
          schema: { type: string }
        - name: business_type
          in: query
          schema: { type: string }
        - name: verification_status
          in: query
          schema: { type: string }
        - name: source
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Ward coverage
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WardCoverage"

  /intelligence/coverage/boroughs:
    get:
      operationId: getBoroughCoverage
      tags: [intelligence]
      summary: Get coverage by boroughs
      parameters:
        - name: zone_id
          in: query
          schema: { type: string }
        - name: area_id
          in: query
          schema: { type: string }
        - name: ward_id
          in: query
          schema: { type: string }
        - name: borough_id
          in: query
          schema: { type: string }
        - name: business_type
          in: query
          schema: { type: string }
        - name: verification_status
          in: query
          schema: { type: string }
        - name: source
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Borough coverage
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BoroughCoverage"

  /intelligence/coverage/sources:
    get:
      operationId: getSourceCoverage
      tags: [intelligence]
      summary: Get coverage by sources
      parameters:
        - name: zone_id
          in: query
          schema: { type: string }
        - name: area_id
          in: query
          schema: { type: string }
        - name: ward_id
          in: query
          schema: { type: string }
        - name: borough_id
          in: query
          schema: { type: string }
        - name: business_type
          in: query
          schema: { type: string }
        - name: verification_status
          in: query
          schema: { type: string }
        - name: source
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Source coverage
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SourceCoverage"

  /intelligence/coverage/quality:
    get:
      operationId: getQualityCoverage
      tags: [intelligence]
      summary: Get quality coverage metrics
      parameters:
        - name: zone_id
          in: query
          schema: { type: string }
        - name: area_id
          in: query
          schema: { type: string }
        - name: ward_id
          in: query
          schema: { type: string }
        - name: borough_id
          in: query
          schema: { type: string }
        - name: business_type
          in: query
          schema: { type: string }
        - name: verification_status
          in: query
          schema: { type: string }
        - name: source
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Quality coverage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityCoverage"


  /prospects:
    get:
      operationId: listProspects
      tags: [prospects]
      summary: List all prospects
      parameters:
        - name: zone
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of prospects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Prospect"
    post:
      operationId: createProspect
      tags: [prospects]
      summary: Create a new prospect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProspectInput"
      responses:
        "201":
          description: Prospect created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prospect"

  /prospects/{id}/convert:
    put:
      operationId: convertProspect
      tags: [prospects]
      summary: Convert a prospect to a shop
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Prospect converted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prospect"
        "404":
          description: Prospect not found

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginCredentials"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToken"
        "401":
          description: Invalid credentials

  /shops:
    get:
      operationId: listShops
      tags: [shops]
      summary: List all shops
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search by shop name, owner name, or mobile
        - name: page
          in: query
          schema:
            type: number
          description: Page number
        - name: limit
          in: query
          schema:
            type: number
          description: Items per page
      responses:
        "200":
          description: List of shops
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopList"
    post:
      operationId: createShop
      tags: [shops]
      summary: Create a new shop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopInput"
      responses:
        "201":
          description: Shop created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shop"

  /shops/{id}:
    get:
      operationId: getShop
      tags: [shops]
      summary: Get shop by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Shop found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shop"
        "404":
          description: Shop not found
    put:
      operationId: updateShop
      tags: [shops]
      summary: Update a shop
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopUpdate"
      responses:
        "200":
          description: Shop updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shop"
        "404":
          description: Shop not found
    delete:
      operationId: deleteShop
      tags: [shops]
      summary: Delete a shop
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Shop deleted
        "404":
          description: Shop not found

  /collections:
    get:
      operationId: listCollections
      tags: [collections]
      summary: List collection entries
      parameters:
        - name: shopId
          in: query
          schema:
            type: number
        - name: startDate
          in: query
          schema:
            type: string
        - name: endDate
          in: query
          schema:
            type: string
        - name: paymentStatus
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: number
        - name: limit
          in: query
          schema:
            type: number
      responses:
        "200":
          description: List of collections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionList"
    post:
      operationId: createCollection
      tags: [collections]
      summary: Create a collection entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionInput"
      responses:
        "201":
          description: Collection created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"

  /collections/{id}:
    get:
      operationId: getCollection
      tags: [collections]
      summary: Get a single collection entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Collection found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "404":
          description: Not found
    delete:
      operationId: deleteCollection
      tags: [collections]
      summary: Delete a collection entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Collection deleted successfully
        "404":
          description: Not found
    put:
      operationId: updateCollection
      tags: [collections]
      summary: Update a collection entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionUpdate"
      responses:
        "200":
          description: Collection updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "404":
          description: Not found

  /collections/{id}/payment:
    patch:
      operationId: updatePaymentStatus
      tags: [collections]
      summary: Mark a collection as paid or pending
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentUpdate"
      responses:
        "200":
          description: Payment status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "404":
          description: Not found

  /reports:
    get:
      operationId: getReports
      tags: [reports]
      summary: Get report data with filters
      parameters:
        - name: shopId
          in: query
          schema:
            type: number
        - name: week
          in: query
          schema:
            type: string
          description: ISO week string e.g. 2024-W01
        - name: month
          in: query
          schema:
            type: string
          description: Month string e.g. 2024-01
        - name: startDate
          in: query
          schema:
            type: string
        - name: endDate
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Report data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResult"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get current settings
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /routes/today:
    get:
      operationId: getTodayRoute
      tags: [routes]
      summary: Get today's route
      responses:
        "200":
          description: Today's route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        "404":
          description: No route found for today

  /routes:
    get:
      operationId: listRoutes
      tags: [routes]
      summary: List all routes
      responses:
        "200":
          description: List of routes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Route"

  /routes/eligible-shops:
    get:
      operationId: getEligibleShops
      tags: [routes]
      summary: Get shops with valid GPS for route planning
      responses:
        "200":
          description: List of eligible shops
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Shop"

  /routes/generate:
    post:
      operationId: generateRoute
      tags: [routes]
      summary: Generate a new route
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteGenerateRequest"
      responses:
        "201":
          description: Route created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        "400":
          description: Invalid request
        "409":
          description: Route already exists for this date

  /routes/{id}:
    get:
      operationId: getRoute
      tags: [routes]
      summary: Get a specific route
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Route found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        "404":
          description: Route not found

  /routes/{id}/start:
    post:
      operationId: startRoute
      tags: [routes]
      summary: Start a route
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Route started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        "400":
          description: Invalid status
        "404":
          description: Route not found

  /routes/{id}/complete:
    post:
      operationId: completeRoute
      tags: [routes]
      summary: Complete a route
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Route completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        "400":
          description: Invalid status or pending stops
        "404":
          description: Route not found

  /routes/{id}/cancel:
    post:
      operationId: cancelRoute
      tags: [routes]
      summary: Cancel a route
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Route cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        "400":
          description: Cannot cancel completed route
        "404":
          description: Route not found

  /routes/{id}/regenerate:
    post:
      operationId: regenerateRoute
      tags: [routes]
      summary: Regenerate a route
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteGenerateRequest"
      responses:
        "201":
          description: New route created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        "400":
          description: Invalid request
        "404":
          description: Route not found

  /routes/{id}/stops/{stopId}/visit:
    post:
      operationId: visitStop
      tags: [routes]
      summary: Mark a stop as visited
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
        - name: stopId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisitStopInput"
      responses:
        "200":
          description: Stop marked as visited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        "400":
          description: Invalid status
        "404":
          description: Route or stop not found

  /routes/{id}/stops/{stopId}/skip:
    post:
      operationId: skipStop
      tags: [routes]
      summary: Skip a stop
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
        - name: stopId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkipStopInput"
      responses:
        "200":
          description: Stop skipped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        "400":
          description: Invalid status or missing reason
        "404":
          description: Route or stop not found

